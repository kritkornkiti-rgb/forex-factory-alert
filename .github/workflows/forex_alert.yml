name: Forex Factory Telegram Alert (24/7)

on:
  schedule:
    # รันทุก 15 นาที ในวันจันทร์ - ศุกร์
    - cron: '*/15 * * * 1-5'

  workflow_dispatch:

jobs:
  forex-alert:
    name: Check Forex Factory News
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🚀 Run Forex News Check & Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python forex_news.py --cron-check --window 35
